[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-gateway"
version = "0.1.0"
description = "Read-only Python gateway exposing office mdpf water-meter data over Modbus TCP and BACnet/IP."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]